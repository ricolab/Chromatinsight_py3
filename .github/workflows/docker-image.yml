name: Docker Build and Push

on:
  push:
    branches: [ "main" ] # Trigger workflow on push to the main branch
    # You could also trigger on tags, e.g., tags: [ 'v*.*.*' ]
  workflow_dispatch: # Allows manual triggering from the Actions tab

env:
  # Set the image name using the organization/user and repo name (automatically lowercase)
  # github.repository gives you 'ricolab/Chromatinsight_py3'
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest # Use a standard Linux runner

    # Grant permissions for the GITHUB_TOKEN
    permissions:
      contents: read      # Needed to checkout the code
      packages: write     # Needed to push Docker images to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Checks out your code

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # Use the automatically generated GITHUB_TOKEN for authentication
          username: ${{ github.actor }} # User who triggered the workflow
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional: Extract metadata like tags and labels - recommended
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }} # Format: ghcr.io/ricolab/chromatinsight_py3
          # Creates tags like 'latest' for default branch, git sha, etc.
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # Tells docker build to use the root of the repo as context
          push: true # Actually push the image
          tags: ${{ steps.meta.outputs.tags }} # Use tags generated by metadata-action
          labels: ${{ steps.meta.outputs.labels }} # Use labels generated by metadata-action
            # cache-from: type=gha # <-- Comment out or remove
      # cache-to: type=gha,mode=max # <-- Comment out or remove
